# JVM
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Build performance
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# Logging
org.gradle.logging.level=lifecycle

# AndroidX
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# Kotlin
kotlin.code.style=official
kotlin.mpp.androidSourceSetLayoutVersion=2
kotlin.mpp.enableCInteropCommonization=true

# KSP
ksp.use.worker.api=true

# Temporary AGP 9 bridge while Android application modules and remaining legacy KMP modules
# still use the external Kotlin plugin and legacy Android DSL. Remove after the AGP 9 migration.
android.builtInKotlin=false
android.newDsl=false
