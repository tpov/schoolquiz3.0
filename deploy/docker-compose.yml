# Manual local Firebase emulator. No production credentials or accounts.
services:
  firebase-emulator:
    profiles: [manual]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.firebase
    image: schoolquiz-firebase:prepared-20260926
    ports:
      - "127.0.0.1:15001:5001"
      - "127.0.0.1:18080:8080"
      - "127.0.0.1:19099:9099"
    volumes:
      - ../.local/firebase:/state
    restart: "no"
