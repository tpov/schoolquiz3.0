# tickets.toml — epic-ordinary-delivery: stories in build order.
# Inception breakdown of the epic's Done-when (epic-ordinary-delivery.md, night 2026-10-05/06;
# revised after the independent critic review the same night).
# Table order is the build order; `id` names a story for good and is not an order.
# Done-when 4 is split client/server (2.4 now / 2.8 blocked): AD-5 puts the shown-terms check on
# the server, and a client-only proof must not close the epic criterion.
# Done-when 5 is split written/adopted/proven (2.5 now / 2.9 blocked / 2.6 blocked): each of the
# three parts has a named owner.
# Scope rule for this inception (fixed assumption): a story is dispatchable "now" when the
# orchestrator can prove it locally from this tree — code + JVM/node-free tests only. Anything
# needing a physical device, Play, a live demo backend/emulator (Node contract tests, Firebase
# callables) or an owner decision is dispatch = "blocked" with the reason named. Real-phone
# confirmation of the same behavior rides the epic-candidate-rig device stories (1.3/1.5), story
# 2.7 and final acceptance, not these.
# Amendment 2026-10-07: the demo backend was raised by the owner's 06.10 decision (container
# schoolquiz-demo-firebase-20261004, no restart policy) and the owner dispatched server-side work,
# so the backend/Node-test clause no longer blocks 2.8; statuses below updated to actual
# (night-impl commits + evidence 2026-10-06-*).

