# Provenance: direct owner order «квиз 5 эпик весь делай» (2026-10-16, this session) — the epic's
# recorded deferral ("unlocks last of the trio", night-2026-10-05 track D) is superseded by the
# owner's explicit instruction and the dedicated branch. The epic `after` epics 3/4 still carry
# hitl tails (3.9 two physical devices; 4.10 device disconnect/resume proof): per the epic-2/3
# scope rule those are named in waits, do NOT gate dispatchable stories, and remain owner items
# that block final acceptance, not the build.
# Scope rule (fixed assumption, epic-2/3 precedent): a story is dispatchable "ready" when the
# orchestrator can prove it from this tree — code + JVM/Node tests, including Node contract tests
# against the restored demo backend (container schoolquiz-demo-firebase-20261004). Anything
# needing a physical device (two devices), owner-only visual acceptance or a new owner decision
# is "blocked"/hitl with the reason named; real-phone confirmation rides hitl stories and final
# acceptance. Rig runs follow the owner's hitl-матрица-на-риге decision (night-2026-10-10).
# Sources: USER-CONTINUATION-PLAN.md §3 (ТЗ07A done by earlier shifts; ТЗ07B/C, ТЗ08A–C open),
# §4 contracts and tournament special cases; AD-17/AD-23/AD-31; contract-map gates ONLINE-O1,
# UX-O2, UX-O3, UX-O4/access; online-o2-contract.md (adopted 2.9, blob e142341e…); SPEC CAP-11/12.
# Brownfield baseline (inception inventory, 2026-10-16): the six course-tournament callables, the
# QUALIFICATION→BRACKET→FINISHED/CANCELLED state machine, meeting PROPOSE/CONFIRM/READY storage,
# sweep worker (lease/cursor), escrow funding, rules denial, the exact qualification calculation
# (tournament-qualification-{compact,version,calculation}.js, phases VALIDATE→…→PUBLISHED,
# 4096/4097-player cases green) and the scan/freeze/versioning fence already exist server-side.
# The client has NO bindings for the six callables and only legacy shelf screens
# (TournamentEventScreen placeholder; fetchTournamentOverview legacy shelf). The OLD fixed prize
# DTO ({first,second,third}, maximumLiabilityBoxes=first+second+2*third) is still the only CREATE
# shape — UX-O2 replaces it with a versioned dynamic ordered list, legacy events stay readable.
# The final NOIR restyle of competition journeys belongs to epic-9; this epic builds functional
# journeys in current conventions (Decompose/Compose, RU/UK/EN, AD-21 states).

