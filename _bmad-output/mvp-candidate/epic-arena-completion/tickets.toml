# tickets.toml — epic-arena-completion: stories in build order.
# Inception 2026-10-08: the approved night draft (night/e3-e8-drafts, 18905ade) converted to the
# canonical breakdown per owner decision batch 2 item 1 (owner-decisions-2026-10-08.md). Story set
# is the draft's, unchanged (12 stories); statuses set to actual at inception.
# Scope rule for this inception (fixed assumption, epic-2 precedent): a story is dispatchable
# "ready" when the orchestrator can prove it from this tree — code + JVM/Node tests, including
# Node contract tests against the restored demo backend (container schoolquiz-demo-firebase-20261004).
# Anything needing a physical device, two devices, or an owner/external input is "blocked" with the
# reason named; real-phone confirmation rides hitl stories and final acceptance.
# Epic-3 specifics: oффлайн/подготовленные пути ONLINE-O2 не ждут; онлайн HARD-переходы ждут 3.1.
# The demo fixtures manifest for roles/banks (plan §2 Шаг 4) does NOT exist yet — it is the server
# half of 3.3 and the gate of 3.11 (and 3.12 after it).

