# tickets.toml — epic-authoring-review: stories in build order.
# Inception 2026-10-08: the approved night draft (night/e3-e8-drafts, 18905ade) converted to the
# canonical breakdown per owner decision batch 2 item 1 (owner-decisions-2026-10-08.md). Story set
# is the draft's, unchanged (10 stories); statuses set to actual at inception.
# Scope rule for this inception (fixed assumption, epic-2 precedent): a story is dispatchable
# "ready" when the orchestrator can prove it from this tree — code + JVM/Node tests, including Node
# contract tests against the restored demo backend (container schoolquiz-demo-firebase-20261004).
# Anything needing a physical device or an owner decision is "blocked" with the reason named.
# Epic-4 specifics: эпик-предпосылки закрыты — epic-1 candidate/backend (1.1/1.2) и epic-2
# foundations (2.1–2.6, 2.8–2.13) done; OQ-2 остаётся parked (не добавляется, spec Open questions);
# TZ06B views — контракт для эпика 8 (CAP-26, AD-30); демо-фикстуры ролей при необходимости
# создаются по plan §2 Шаг 4 (общий манифест с эпиком 3, server half 3.3).

