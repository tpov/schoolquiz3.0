# tickets.toml — epic-authoring-review: stories in build order.
# Inception 2026-10-08: the approved night draft (night/e3-e8-drafts, 18905ade) converted to the
# canonical breakdown per owner decision batch 2 item 1 (owner-decisions-2026-10-08.md). Story set
# is the draft's, unchanged (10 stories); statuses set to actual at inception.
# Scope rule for this inception (fixed assumption, epic-2 precedent): a story is dispatchable
# "ready" when the orchestrator can prove it from this tree — code + JVM/Node tests, including Node
# contract tests against the restored demo backend (container schoolquiz-demo-firebase-20261004).
# Anything needing a physical device or an owner decision is "blocked" with the reason named.
# Epic-4 specifics: эпик-предпосылки закрыты — epic-1 candidate/backend (1.1/1.2) и epic-2
# foundations (2.1–2.6, 2.8–2.13) done; OQ-2 остаётся parked (не добавляется, spec Open questions);
# TZ06B views — контракт для эпика 8 (CAP-26, AD-30); демо-фикстуры ролей при необходимости
# создаются по plan §2 Шаг 4 (общий манифест с эпиком 3, server half 3.3).

[[story]]
id = "4.1"
slug = "tz06a-admission-draft-verification"
title = "TZ06A admission/price: re-establish verification status of the eight-file local draft; catalog/selected/random use one current admitted-lesson universe; read limits, no writes on error, issued tickets immutable; land as a separate commit with full Node/Firebase checks; evidence docs/agents/evidence/<date>-tz06a/"
covers = ["CAP-2", "CAP-3"]
after = [{ epic = 1, needs = "identified candidate source state and restored backend" }]
waits = [
  "epic-1: candidate identity/build base — DONE (1.2)",
  "epic-2: durable delivery/config foundations — DONE (2.1–2.6)",
]
status = "done" # 2026-10-09: статус переподтверждён на актуальном кончике ветки 99091eb5 (с 2a1eabd +18 документированных коммитов); «восемь файлов» идентифицированы как запечатанный манифест проб (7 исходников допуска/цены + SHA пробника); пересверка: 6/6 файлов допуска/цены MATCH, дрейф только index.js — атрибутирован (0 строк проводки допуска/цены в дифе); гейты кончика: functions 88/88 (как в эпохальном checkpoint), rules 149/149; запечатанные live-пробы окружение-заперты (rig эпохи schoolquiz-mvp-firebase:8080, хостовый 8080 занят владельцем) — записано как ограничение; evidence docs/agents/evidence/2026-10-09-tz06a/

