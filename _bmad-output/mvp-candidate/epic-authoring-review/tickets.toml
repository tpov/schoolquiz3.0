status = "done" # 2026-10-10: код + живой journey закрыты. Код смены 9: порог TESTING конфигурируемый (configs/arena_review 1..3, дефолт 2, вне диапазона — громкий отказ) с по-вопросным ревью и биндингом appliedConfigRevision+assignmentGeneration (fdf4d469), явные сегментные решения correct/error без молчаливого accepted (48581283), клиентский провод по-вопросных оценок (478e5384), reviewer UI + авторский парсер именованных исходов (82364e5a), journey-тул (c8eb0169); живой прогон: rig-ревьюер User28BUFJ оценил вопросы 1,1 через UI+outbox (квитанция в Room рига), скриптованный второй ревьюер 3,3 — средние ровно 2.0=порог; живой flip конфига: ревизия 2 (порог 3) те же записи → все вопросы failed, ревизия 3 (порог 2) → passed — результат привязан к ревизии живьём; LOGIC 2 → failedStages ["LOGIC"] без причины; пустой перевод не засчитал en (missing text never approved), полный → {en:100} → PUBLISHED (version 1); сегментные correct/error → translationScore 50, silent accepted → 400 «explicit decision»; автор: view PUBLISHED/failedStages[] + settle на риге (activeSubmissionId очищен, rig-room-settle-extract). Попутно живой прогон нашёл и починил регрессию: влитые __en-варианты перевода попадали в по-вопросные исходы и молча снимали isTested (9999bd17 + кейс сюиты); ktlint-фикс провода (297af3ba). Гейты: functions 94/94, quest-authoring domain+data+presentation зелёные, firebase 272 (ровно 2 предсуществующих fixture-pin, атрибуция 2026-10-08), ktlint-модули истории зелёные (красные 4.3-эры — список владельца), detekt предсуществующий jvm-target 27 (владелец). Границы: рендеринг по-вопросных исходов в UI автора — UX-хвост (view+парсер доказаны); functions-эмулятор: один вызов при перезапуске без env ушёл в metadata и умер без записей (README). Инцидент и границы в evidence docs/agents/evidence/2026-10-10-testing-review/

