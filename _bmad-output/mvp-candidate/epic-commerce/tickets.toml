e/premium-grant-fixture.js), выдана и подтверждена (+30d лот, premium ПЕРЕЖИЛ entry-синк на устройстве — 74-home-1.png); (2) кнопка не оседала из-за ВТОРОГО дефекта: submitGiftBoxOperation отвечал ПЛОСКИМ телом, а клиентский reader (спек 7, GiftClaimEnvelopeMappingTest) требует конверт {replayed,result} — каждый ответ падал ENVELOPE_INVALID в вечный ретрай; сервер исправлен на конверт (openGiftBox и economy.OPEN_GIFT_BOX остались плоскими), тесты сервера обновлены + пин replay-формы, functions 124/124 no-env, провод подтверждён сырой HTTP-пробой; (3) НОВАЯ КЛИЕНТСКАЯ НАХОДКА: даже при правильном конверте интент клейма НЕ резолвится — строка PREMIUM_DAILY в Room gift_claim_intents живёт, receipt в mutation_receipts не пишется, кнопка вечно «Забираємо подарунок…» (скрины 74-fresh-2/3), при этом бокс доезжает профайл-синком (FAB 2, Серія 10) и серверный клейм закоммичен с чеком; следующая сессия — resolve-ветка клейм-цикла на клиенте (GiftClaimRepositoryImpl/ClaimPremiumDailyGiftUseCase), серверная половина 7.4 PASS

