# tickets.toml — epic-commerce: stories in build order.
# Inception 2026-10-08: the approved night draft (night/e3-e8-drafts, 18905ade) converted to the
# canonical breakdown per owner decision batch 2 item 1 (owner-decisions-2026-10-08.md). Story set
# is the draft's, unchanged (8 stories); statuses set to actual at inception.
# Scope rule for this inception (fixed assumption, epic-2 precedent): a story is dispatchable
# "ready" when the orchestrator can prove it from this tree — code + JVM/Node tests, including Node
# contract tests against the restored demo backend (container schoolquiz-demo-firebase-20261004).
# ОСОБОЕ УКАЗАНИЕ ПРОГОНА (из черновика, остаётся в силе): inventory Play SKU и денежных цен —
# ВНЕШНЯЯ зависимость (владелец, Play Console). SKU НЕ сочиняются; 7.1 — история-внешний-вход;
# реальные sandbox-кейсы 7.6 без него NOT_RUN. Fake Billing проверяется отдельно от Play (план §4).
# ОБЛАСТЬ ПРОГОНА 2026-10-19 (restatement находки 7.4, ветка night/e7-commerce): Epic 7 закрыт
# серверно (7.5/7.7/7.8 done, 7.2 device-proven кроме Play-лока), но клиент не умеет ЗАБИРАТЬ
# подарки: OFFLINE_STREAK и PREMIUM_DAILY не шлёт никто, visited() из GiftBoxStreak без
# production-вызовов, UI «Получить подарок» отсутствует, nextBonusBoxAtMs клиентом не
# отображается, премиальная поверхность — голый premiumUntilMs. Этот прогон строит недостающую
# клиентскую проводку заявок против живого серверного контракта (submitGiftBoxOperation kinds
# VISIT / OFFLINE_STREAK / PREMIUM_DAILY, локальные operationId-интенты, строгий разбор конверта,
# статусы-исходы), входную синхронизацию серии (офлайн-заявка ДО обновления профиля и визита),
# минимальную серверную премиальную поверхность, честные NOT_RUN для внешнего — и собирает MVP
# APK, чтобы device-пруф 7.4 стал выполним при первом же подключённом телефоне. Сервер заморожен:
# ни изменений контракта, ни правил, ни закупочного конвейера.

