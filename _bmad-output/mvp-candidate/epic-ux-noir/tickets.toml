# tickets.toml — epic-ux-noir: stories in build order.
# Inception 2026-10-28 (autonomous wave, night/e7-commerce): epic Done-when (epic-ux-noir.md,
# CAP-17) sliced by journeys per owner mandate. Story ids follow the source journey's epic number
# (обычное обучение = 9.2 from epic-2, арена = 9.3, …, соц = 9.8); 9.1 owns the shared NOIR
# foundation + the sweep inventory this epic is responsible for; 9.9 is the final device sweep and
# accessibility proof (Done-when item 2) — hitl on the owner's rig.
#
# Canonical styling sources in this tree: noir-design-system/NOIR-SPEC.md (§1–§10),
# android/core/designsystem/.../noir/ (NoirTheme/NoirComponents — the single shared Compose
# implementation), ux-constraints.md UX-1–UX-23. NOTE: the final DESIGN.md/EXPERIENCE.md pair
# referenced by the epic (planning-artifacts/ux-designs/ux-schoolquiz3.0-2026-09-28/) is NOT
# present in the tree (checked 2026-10-28: directory absent on VPS) — styling is transcribed from
# NOIR-SPEC + the in-tree noir package; where a journey has journey-specific constraints
# (UX-5/6/7/9/20/22) they bind from ux-constraints.md.
#
# Scope rule (fixed for this inception, arena epic precedent): a story is dispatchable "ready"
# when the orchestrator can prove it from this tree — code + JVM/Robolectric Compose tests via sgw
# (JDK 27) + ktlint attribution. Device visual/a11y proof (real Compose font scaling, assistive)
# is hitl — story 9.9.
#
# Owner caveat for 9.4 (инсепшн 2026-10-28): поверхности предложений автора (4.21–4.25 — entry
# «Сообщить об ошибке» на результате, «Предложить правку», target-path в QuestCreate, секция
# «Предложения» в Decisions) строятся соседним потоком прямо сейчас — НЕ стилизуются в этой волне;
# they are restyled after 4.26 (open item, зафиксирован в 9.4).
#
# Survey method (2026-10-28, story 9.1 inventory): main-source presentation files importing
# androidx.compose.material3 without any designsystem.noir import (grep over
# android/feature/*/presentation), plus manual reading of each hit; component/uistate files
# without composable UI are out of scope.
#
# WAVE-2 CORRECTION (2026-10-28, вторая смена): верификация заявлений волны-1 показала слепую
# зону метода 9.1 — файлы, импортирующие designsystem.noir И сырой material3 ОДНОВРЕМЕННО,
# инвентарём не ловились, а статусы-комментарии утверждали «сырого material3 нет». Проверка тел
# (не импортов) нашла: raw m3 кнопки/диалоги/поля в 8 турнирных экранах (9.5 — закрыто этой
# волной настоящим рестайлом) и в 4 экранах quest-authoring (9.4 — модуль у соседнего прогона,
# blocked); feature-local legacy-форк рефералки в ShopView (9.7 — open item на дизайн-решение
# владельца); PollsScreen у соседнего эпика-8 в полёте (9.8 — вердикт садится с их фикс-паком).

