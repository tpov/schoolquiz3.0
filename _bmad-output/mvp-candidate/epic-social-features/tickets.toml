[[story]]
id = "8.1"
slug = "ux-o7-poll-contracts"
title = "UX-O7 poll contracts (OQ-7) before vote writes: series/revision identity, respondent-question uniqueness, delivery/recovery, one counts snapshot; retry is not a second vote, editing before submission grants no post-vote revision; evidence docs/agents/evidence/<date>-ux-o7-polls/"
covers = ["CAP-24"]
after = [{ epic = 2, needs = "delivery/projection foundations" }]
waits = [
  "OQ-7/UX-O7: сам контракт пишется этой историей (contract-map Remaining gates: «…before real vote writes»)",
  "epic-2: delivery foundations — DONE",
]
status = "done" # 2026-10-09: полная редакция контракта ux-o7-poll-contract.md (гейт UX-O7 закрыт построчно: identity тройки §2, уникальность §3, delivery/recovery §4, один снапшот счётов §5, retry≠второй голос §6.1, правка до отправки §6.2); закрепляющие транспортные тесты UxO7PollVoteIdentityContractTest 4/4 зелёные, гейт sgw :shared:core:outbox:jvmTest BUILD SUCCESSFUL; константа/реестр голоса — с 8.2 (OutboxOperationsRegistryTest); evidence docs/agents/evidence/2026-10-09-ux-o7-polls/

[[story]]
id = "8.2"
slug = "poll-series-run"
title = "A poll series runs end to end (AD-28): author creates 2–8 options single/multiple choice without correctness/difficulty; one confirmed nonempty choice set per participant; distribution hidden until the confirmed vote; percentages over distinct respondents per question so multi-choice totals may exceed 100%; retry never adds another vote; series progress/statistics keep identity; evidence docs/agents/evidence/<date>-polls/"
covers = ["CAP-24"]
after = [{ story = "8.1", needs = "UX-O7 contracts" }, { epic = 2, needs = "delivery foundations" }]
waits = [
  "epic-2: delivery foundations — DONE",
  "8.1: UX-O7 contracts",
  "hitl: device proof of vote/retry/distribution flow",
]
hitl = true
status = "done" # 2026-10-18 ночь: полным циклом на двух устройствах. Pixel (UserG9FY6E): авторинг→публикация→скрытое распределение→голос red→ключ completed→раскрытие 100%. Samsung A14 (UserOVDSRF, свежий uid): голос blue — с ПОПРАВКОЙ §2 (uid в sourceId) ключ свой, доставка completed, распределение 50/50, «Ответило: 2». Ретрай-дедуп держится формулой ключа (§6.1), контрактная правка в ux-o7-poll-contract.md ждёт подтверждения владельца. Evidence docs/agents/evidence/2026-10-18-pixel-social/polls/ (09 — 50/50)

