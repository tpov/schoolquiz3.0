after = [{ epic = 2, needs = "delivery foundations" }]
waits = [
  "epic-2: delivery foundations — DONE",
  "hitl: device proof of the authoring screen",
]
hitl = true
status = "blocked" # hitl; UX-O4 продуктовые решения закрыты; автопродление/перевыпуск ссылки не назначены

[[story]]
id = "8.4"
slug = "private-quiz-run-limits-visibility"
title = "A private quiz runs under AD-29: new start atomically checks enabled/unexpired link and startedCount < current limit then increments; limit changes preserve startedCount and never interrupt a started attempt's original deadlines; closing/expiring the link closes only new starts; recovery timeout scores the whole quiz with remaining questions unanswered (no paid-correct effect); current show-result governs every own result incl. past attempts while author statistics remain; evidence docs/agents/evidence/<date>-private-quiz-run/"
