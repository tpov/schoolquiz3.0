status = "done" # 2026-10-22: код+тесты (Done bar scope rule); device-пруф (два устройства+тайм-аут) — рецепт владельцу (evidence 2026-10-22-private-quiz-run/). Гейт расширен в run-контракт: старт несёт замороженную идентичность (quizVersion/submissionId/participantAttemptIndex), отказы — машиночитаемые коды в details. Сервер: private-quiz-run.js (чистый модуль: attemptDeadlineMs от исходного старта = Σ HARD-времён + окна AD-31; finishAttempt — терминал FINISHED по присланной порции / TIMEOUT по всему замороженному набору, невыданные — «без ответа», скорер существующий scoreAttempt); private_quiz.SUBMIT_ATTEMPT в реестре мутаций (повтор по startId — сохранённый терминал); callables fetchPrivateQuizRun (только публичные половины через question-redaction, showResult сознательно не едет), readPrivateQuizResult (ТЕКУЩАЯ showResult при каждом чтении; ленивый тайм-аут), readPrivateQuizStatistics (автор, любой флаг). Клиент: lesson-runner domain PrivateQuizRun/PrivateQuizEntry/Refusal + StartPrivateQuizAttemptUseCase (повтор — тот же startId, AD-6), data parser+repo (коды двери → типизированные отказы), firebase transport + сторож имён; RunnerUiState.Result.privateCompletionOnly + ResultContent (подтверждение без чисел, никаких нулей). ДОПОЛНЕНО 2026-10-22 (вторая смена): прогон достигаем из UI — выдача замораживает прогон под стартом (run.questions + run.keys перевода, первый сервис в транзакции; подача переводит ответы Ordering/FillBlank ключами заморозки — round-trip тест с перемешанными id), экран прогона PrivateQuizRunnerComponent/Factory (дверь → вопросы по исходным срокам из расписания от startedAtMs → подача очередью PrivateQuizSubmitOutboxWriter (ключ = startId, permanentReceipt, без согласия) → чтение результата по текущей showResult), вход из категории «Приватные квизы» на quizzes screen: строки списком сохранённых квизов владельца → QuizzesConfig.PrivateQuizRunner (указатель, снимается при смерти процесса — попытку закрывает серверный тайм-аут) → дочерний экран