  "epic-2/ONLINE-O2 — DONE (2.5/2.6/2.9)",
  "epic-2: delivery/projection foundations — DONE",
  "8.3: quiz authoring — DONE 2026-10-22 (код+тесты)",
  "hitl: device proof incl. two-device and timeout cases",
]
