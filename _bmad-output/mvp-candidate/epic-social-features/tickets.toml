after = [{ story = "8.3", needs = "quiz authoring" }, { epic = 2, needs = "delivery foundations and ONLINE-O2" }]
waits = [
  "epic-2/ONLINE-O2 — DONE (2.5/2.6/2.9)",
  "epic-2: delivery/projection foundations — DONE",
  "8.3: quiz authoring (hitl)",
  "hitl: device proof incl. two-device and timeout cases",
]
hitl = true
status = "blocked" # hitl + after 8.3 (hitl)

