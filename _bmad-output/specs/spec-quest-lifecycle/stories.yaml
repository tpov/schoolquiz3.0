- id: "1"
  title: Close the client's write access to the quests collection
  description: >-
    CAP-6. Remove visibleOn, archived and catalogId from the quests update allowlist
    and set create to false, so placement becomes server-owned in fact and not only by intent.
  spec_checkpoint: false
  invoke_dev_with: >-
    firestore.rules:97-116. The app never writes /quests — FirebaseQuestRemoteDataSource
    only reads and calls one callable, and authored content goes to private/{uid}/catalogs/...
    via FirebaseQuestPrivateRemoteDataSource.kt:42-47. So both the create rule and those three
    update keys can go without losing a feature. Add the deny cases to
    scripts/rules-emulator-test.js, which already has actors and quest fixtures.

- id: "2"
  title: "[NOT THIS WORKSTREAM] Grant a qualification to a named person, with a reason"
  description: >-
    CAP-7, first half. Owned by a separate agent at the owner's direction; listed here only so the
    dependency is visible. Until it lands, qualifications are set by hand in the Firebase console.
  spec_checkpoint: false
  invoke_dev_with: >-
    DO NOT IMPLEMENT IN THIS WORKSTREAM. Notes for whoever does: copy the structure of
    decideVerification (functions/index.js:618-666) — refuses to act on the caller, writes
    users/{uid} and profiles/{uid} in one transaction in the shape FirebaseUserStatsDataSource.kt:88
    expects. The gate is rank-bounded, not admin-only: DEVELOPER is the top role, since
    developerLevel overrides TESTING, LOGIC and TRANSLATION at functions/index.js:3450-3462 while
    adminLevel covers only the first two. So an actor may grant any role strictly below their own
    level and never to themselves. Resolve the target by nickname through nickname_claims, which
    already maps canonical nickname to uid (functions/index.js:2902) and is server-only.
    Watch the threshold inconsistency: admin gates read >= 100 but developer gates read > 100, so
    granting a developer exactly 100 silently does nothing.

- id: "3"
  title: Cut the automatic path from ratings to privilege
  description: >-
    CAP-7 second half and CAP-8. Ratings feed their own author-reputation field, the privilege
    gates stop reading it, and the levels farmed so far are zeroed.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    Change QUEST_RATING_QUALIFICATION_USER_FIELD and _PROFILE_FIELD (functions/index.js:88-89)
    to an author-reputation name; both the write at :2040-2053 and the read-back at :2057-2065
    are driven by those constants, so the code edit is small. Then remove developerLevel from
    isVerifier() and isReviewer() in firestore.rules:186-204 — without that, every curator also
    reads every user's real name, birthday, city and telegram. Decide separately whether
    canSubmit (functions/index.js:2427-2429) keeps its blanket developer override.
    The repair script must do three things, and the third is the one that gets forgotten:
    zero developer/developerLevel on every users/ and profiles/ document, set the first admin
    by hand, and reset qualificationAppliedScore to 0 on every quest_rating_aggregates document
    so the score re-accumulates into the new field. Count the affected accounts before running
    it — the assumption that every level above 100 was farmed needs confirming, not asserting.

- id: "4"
  title: Make review a judgement — a pass threshold and a real reject
  description: >-
    CAP-2 and CAP-3. A quest publishes only above a pass mark, and a reviewer can refuse it
    with a reason that returns it to the author as an editable draft.
  spec_checkpoint: true
  invoke_dev_with: >-
    Today lessonPassed (functions/index.js:2569-2583) asks only whether a score EXISTS —
    hasTestingResult returns true for any non-null testingScore (:3468-3474) — so a 1-out-of-3
    publishes. REVIEW_PASS_LEVEL=100 already exists at :81 but is applied to translation only
    (:2580). lessonReviewStatus (:2565-2567) can return only READY_FOR_PUBLICATION or
    UNDER_REVIEW, so the rejected state is genuinely new. Remember the nightly job:
    reconcileChangedReviewLessons (:1767-1801) reaches publishSubmissionIfReady through the same
    gate, so the threshold must live in lessonPassed and not at the call site. Legacy has no
    prior art here — nothing to copy, design it fresh. The author-facing half needs the reason
    to survive back into the draft the author edits.

- id: "5"
  title: Refuse self-review, except for a developer
  description: >-
    CAP-4. An author gets no review task on their own quest and is refused server-side,
    while a developer may still approve their own.
  spec_checkpoint: false
  invoke_dev_with: >-
    canSubmit (functions/index.js:2427-2455) and availableTasks (:2406-2423) never compare the
    submitting profile's uid to task.ownerUid, though ownerUid is already carried at :2390.
    The owner's rule is explicit and is NOT a blanket refusal: refuse when uid == ownerUid
    UNLESS the caller's developerLevel is above the threshold. Put the guard in canSubmit so the
    server enforces it, and filter availableTasks so the task never appears in the queue either.
    decideVerification's self-refusal at :621-624 is the in-repo precedent for the shape.

- id: "6"
  title: Take content down, put a course back, and record who moved what
  description: >-
    CAP-9, CAP-10 and CAP-11. A retire callable, archive accepted as a move target, and an
    audit record on every placement change including the author-triggered republish reset.
  spec_checkpoint: false
  invoke_dev_with: >-
    Retire: a callable writing visibleOn = [] plus a sync_change; the client half already works
    (QuestRepositoryImpl.kt:126-130) and scripts/seed-bulk/retire-quest.js shows the write shape
    but is hardcoded to CATALOG_ID = 'courses' at line 36 — derive the catalog from the quest.
    Reversibility: add "archive" to PUBLIC_QUEST_SHELVES (functions/index.js:117), one word,
    and make the shelf menu type-aware so a course cannot be sent somewhere it does not belong.
    Audit: inside the existing transaction in setPublicQuestShelf (:1344-1389) capture visibleOn
    before overwriting and store previousVisibleOn, shelfSetByUid, shelfSetAtMs, shelfReason,
    plus a record under admin/shelf_moves/. Write the same record when a republish resets the
    shelf (:2280-2290) with actor = author — that silent demotion is the one nobody can see today.
    Also refuse a curator moving their own quest, mirroring :621-624.

- id: "7"
  title: Give user text an owner, and make it removable
  description: >-
    CAP-13 and CAP-14. A comment records who wrote it and can be taken down — the two things
    that must exist before anything can be reported, moderated or blocked.
  spec_checkpoint: false
  invoke_dev_with: >-
    lessonComments today stores lessonId, authorNickname, authorAvatarUrl, text and createdAt —
    and no author uid (firestore.rules:142-157), so there is nobody to ban. It is also
    'allow update, delete: if false' with no server function touching the collection, so an
    abusive comment cannot be removed by anyone at all. Add the author uid on create, pinned to
    request.auth.uid so it cannot be forged, and add a server-side removal path. Decide what
    happens to comments already posted, which have no uid — the spec's default is that they stay
    readable and reportable but not blockable. Touches LessonComment.kt,
    LessonCommentRepository.kt and FirebaseLessonCommentRepository.kt:34-53.

- id: "8"
  title: Report a thing, and let a moderator rule on it
  description: >-
    CAP-12 and CAP-15. Anyone files a report; a moderator upholds or rejects it; the reporter
    gains reputation when upheld and loses it when rejected.
  spec_checkpoint: true
  invoke_dev_with: >-
    No prior art anywhere: a sweep for complaint, report, abuse, appeal, block and their Russian
    equivalents returns nothing in the current tree and nothing in legacy, whose Reports menu id
    collides with Contacts and opens the phone book. Design the report object so it names a
    target by type — comment, quest, user, and later a chat message — since the chat is stubbed
    but coming. This story gates the Play submission, so it must not wait on the chat.
    The reporter's payout is the same reputation number the review pipeline already uses; do not
    invent a second one without deciding that question first.

- id: "9"
  title: Grade the moderators, and gate who may ban whom
  description: >-
    CAP-16 and CAP-17. A moderator's verdicts are scored against the senior consensus, and a
    moderator can only be banned by someone 100 levels above them or by a developer.
  spec_checkpoint: false
  invoke_dev_with: >-
    Reuse scoreAggregate (functions/index.js:2593-2610) rather than writing a second consensus:
    it already takes the reviewers within ACTIVE_LEVEL_WINDOW = 100 of the top level as the
    senior band, rounds their mean to the verdict, and pays everyone below +3 for matching it,
    0 for missing by one and -3 for missing by two. That is exactly the owner's rule. The ban
    gate is the same 100-unit idea as TRANSLATION_REVIEW_LEVEL_GAP: refuse unless the actor's
    moderatorLevel is at least 100 above the target's, or the actor is a developer. This is the
    story that turns moderatorLevel from an inert field into a real capability — it is read by
    no gate today and requireProfile does not even load it (functions/index.js:2841-2853).

- id: "10"
  title: Fix the chat's shape without building the chat
  description: >-
    The chat stays a stub, but its message contract is written down now so moderation attaches
    to it unchanged when it lands.
  spec_checkpoint: false
  invoke_dev_with: >-
    The owner's instruction is to assume a chat like the legacy one. That shape is
    tpovId, time, user, msg, importance, icon, rating, reaction (ChatEntity.kt:8-19,
    ChatRemote.kt:5-13). Two lessons from legacy worth carrying: the per-message rating slot
    existed and nothing ever wrote it, and importance was the only field ever read — it coloured
    the row at importance == 7. Replace tpovId with a real author uid, for the same reason as
    story 7. Deliverable is the contract and the report-target type, not a screen: no chat UI,
    no message delivery, no chat sync ships here.

- id: "11"
  title: Run the whole circle on six devices, and try to break it
  description: >-
    The success signal. One quest travels author to arena to home across real devices, and the
    four-step abuse chain is attempted at every step and fails.
  spec_checkpoint: false
  done_checkpoint: true
  invoke_dev_with: >-
    Six accounts: author, player, tester, admin, developer, second player for a real tournament
    group. No human login is needed — the app signs in anonymously (AppApplication.kt:102) and
    scripts/devices/uid.sh reads each device's uid; roles are then granted through story 2.
    Seed configs/arena_review and the catalogs, including catalogs/{id}.questType, which nothing
    writes today. The fifteen-scenario matrix and the list of scenarios that cannot run because
    the code path is absent are in brownfield.md section 6. The negative probes belong on the
    emulator, not the live project: farm ratings and confirm no gate moves, score a lesson at
    the pass floor and confirm nothing publishes, attempt a self-review, and attempt a direct
    SDK write to quests.

- id: "12"
  title: Let a rejected quest be sent again
  description: >-
    A rejected or undelivered submission returned the draft to a state the submit path refused,
    so the quest could never be sent again. Found on real devices during story 11; fixed here.
  spec_checkpoint: false
  status: done
  invoke_dev_with: >-
    Rejection and quarantine both return the draft to DRAFT with a reason
    (QuestArenaQuarantineRollback.kt:10-14), and DRAFT was absent from the submittable set, while
    SAVED is assigned only at creation (CreateQuestDraftUseCase.kt:40) — production upsertQuestion
    does not touch status. DRAFT joins SUBMITTABLE_DRAFT_STATUSES; CONFLICT stays out because a
    divergence has its own resolution path. Readiness is validated separately, so admitting DRAFT
    cannot let unfinished work through. The four anonymous requires become six named rejection
    types so the screen can name the real cause instead of always blaming missing questions.
  acceptance_evidence: >-
    QuestArenaSubmissionRejection.kt (new) holds the types and the status set;
    SubmitQuestDraftToArenaUseCase.kt throws them; DefaultQuestCreateComponent.kt maps each to its
    own string; four strings added to values, values-ru and values-uk. Five tests in
    QuestAuthoringUseCaseTest.kt, of which "submit arena accepts a draft returned to DRAFT after
    rejection" fails without the fix. Module green at 42 of 42.
    FakeQuestAuthoringRepository.upsertQuestion no longer raises status to SAVED — that divergence
    from production was why no test caught the dead end.

- id: "13"
  title: Tell the author why the submission came back
  description: >-
    The reason was stored on write and dropped on read, so a rejected author was left guessing.
  spec_checkpoint: false
  status: done
  acceptance_evidence: >-
    HEAD mapped rejectionReason on the way in only — neither QuestDraftEntity.toDomain nor
    QuestDraftSummaryEntity.toDomain read it back. Both now do, the summary query selects it, and
    the My Quests row renders it under the status. Transport codes collapse to one honest sentence
    because a code is not something an author can act on; a reviewer's own words show verbatim.
    Strings added to values, values-ru and values-uk. Covered by
    observeDraftSummaries_carriesRejectionReason, which failed before the mapper fix.
  invoke_dev_with: >-
    rejectionReason survives all the way into QuestDraft (QuestDraft.kt:22) and is written by
    applyRejection (QuestAuthoringLocalDataSource.kt:160) — verified on a device, the column held
    NOT_FOUND. It appears nowhere under android/. Carry it into QuestDraftSummary and render it on
    the My Quests row beside the status badge. Delivery failures store a transport code, so the
    codes need human wording before they are shown: an author must not be told "NOT_FOUND".

- id: "14"
  title: Do not destroy the author's submission when delivery fails
  description: >-
    A missing or renamed server handler counts as a final refusal, which quarantines the mutation
    and rolls the local change back. A deployment fault erases work.
  spec_checkpoint: true
  invoke_dev_with: >-
    Reproduced on a device: the arena submission went WAITING with zero attempts, then
    QUARANTINED after one attempt with NOT_FOUND, and the draft fell from REVIEW_QUEUED to DRAFT
    with nothing shown to the author. NOT_FOUND is classified as a final refusal
    (CallableErrors.kt:112-123) alongside PERMISSION_DENIED and INVALID_ARGUMENT, and quarantine is
    terminal (OutboxRecord.kt:83) with the DAO excluding quarantined rows. A refusal on the merits
    and a handler that is not deployed are different things and must not share a disposition.
    Decide the intended behaviour with the owner before coding: retry with backoff, a distinct
    non-destructive state, or an explicit "could not send" the author can act on.

- id: "15"
  title: Open the draft the author tapped
  description: >-
    Tapping a draft in My Quests opens whichever draft happens to be active, not the one tapped,
    so with more than one draft the author edits the wrong quest.
  spec_checkpoint: false
  invoke_dev_with: >-
    DefaultMyQuestsComponent.onDraftClick discards its draft argument and calls
    navigator.goTo(Destination.OpenQuestCreate) (line 140-142). The editor then loads the active
    draft — on the run device that meant tapping the quest with two questions opened an empty
    duplicate (isActive 0 versus 1 in quest_drafts). Carry the tapped draft id into the create
    destination and load that draft, or activate it on open. Also worth deciding whether two
    drafts may share a title at all: the duplicate here was created by simply re-entering the form.

- id: "15"
  title: Open the draft the author actually tapped
  description: >-
    Tapping any draft opened whichever one happened to be active, silently. Found while verifying
    story 12 on a device; fixed here.
  spec_checkpoint: false
  status: done
  invoke_dev_with: >-
    onDraftClick took the tapped item and discarded it, navigating to OpenQuestCreate, and that
    screen loads the active draft. Rather than parameterise the destination — which would touch the
    shared app-shell and its tests — make the tapped draft active: the editor already opens the
    active one, "exactly one is active" is an existing rule enforced when a draft is created, and
    the DAO already had deactivateOtherDrafts.
  acceptance_evidence: >-
    DAO gains markDraftActive plus a transactional activateDraft; the local source, repository and
    a new OpenQuestDraftUseCase carry it up; the component records the choice before navigating,
    because navigating first would show the previous active draft. Covered by "opening a draft
    makes it the active one", which asserts both that the tapped draft becomes active and that the
    previous one is cleared. Nine fakes across the tree implement the two interfaces and all were
    updated. Full ciCheck green.
