appId: com.tpov.schoolquiz.mvp
name: Three proposal entries up to the author side (4.26)
---
# 4.26: «Сообщить об ошибке» после урока, «Предложить правку» копии, свой урок с
# путём в чужом курсе; mvp = предлагающий, mvpb = автор курса (одобряет в «Решениях»
# → «Предложения»). Без ключа модели проверки предложений уходят в CHECK_DELAYED и
# до автора не доезжают (право видеть — только CHECK_PASSED/решения): авторская
# половина согласования — хвост владельца, здесь честно фиксируются обе стороны.
# Препарация с VPS: seed-author-lesson под аккаунт mvpb + кошелёк mvp (см. скрипт
# scripts/devicefarm-rig-prep.js — watcher «await-users 2»).
- launchApp:
    appId: com.tpov.schoolquiz.mvpb
    clearState: false
- assertVisible: "HOME QUESTS"
- tapOn: "Open menu"
- assertVisible: "^SYNC NOW$"
- tapOn: "^SYNC NOW$"
- extendedWaitUntil:
    visible: "Last sync: .*"
    timeout: 90000
- takeScreenshot: "426-author-client-synced"
# ── Предлагающий: свежий аккаунт mvp, полный синк (сид-курс уже на сервере)
- launchApp:
    clearState: false
- assertVisible: "HOME QUESTS"
- tapOn: "Open menu"
- tapOn: "^SYNC NOW$"
# Ловушка v3: «Last sync: .*» совпадает и с устаревшим лейблом бандла («Last sync:
# 23.10.2026 19:06», evidence 2026-10-31-devicefarm-426-proposals) — строкой синка
# свежесть не доказать, ждём сам сид-каталог. Первый вход в HOME QUESTS даёт синку
# осесть и перечитывает полку (до 30 с).
- tapOn: "^HOME QUESTS$"
- takeScreenshot: "426-proposer-first-home"
# v5 (v4 FALL, evidence 2026-10-31-devicefarm-426-proposals): жёсткий 30с
# extendedWaitUntil убран — в Maestro его таймаут терминирует флоу ДО условного
# ретрая ниже (в трейсе v4 нет ни скрина 426-catalog-absent, ни второго синка).
# Мягкое ожидание не может упасть; реальную догрузку полки делает ретрай.
- waitForAnimationToEnd:
    timeout: 30000
# Каталог не приехал первым синком (v3: сервер чист — сид лёг за 25 с до синка;
# гипотеза — Room-кэш/курсор изолированной сборки не применяет каталог-пулл
# пост-фактум) — повторный SYNC NOW и повторный вход в HOME QUESTS: экран читает
# то, что успело примениться ко второму входу (тот же класс фикса, что «Active
# events» 5.13 v3).
- runFlow:
    when:
      notVisible: "DF author catalog"
    commands:
      - takeScreenshot: "426-catalog-absent-after-first-sync"
      - tapOn: "Open menu"
      - tapOn: "^SYNC NOW$"
      - extendedWaitUntil:
          visible: "Last sync: .*"
          timeout: 90000
      - takeScreenshot: "426-proposer-second-sync"
      - tapOn: "^HOME QUESTS$"
# Жёсткий ассерт только здесь — ПОСЛЕ ретрая: к этому моменту каталог обязан
# приехать, иначе это честный провал, а не дефект конструкции флоу.
- extendedWaitUntil:
    visible: "DF author catalog"
    timeout: 120000
- takeScreenshot: "426-proposer-home-catalog"
# ── Урок автора (DF author course → DF author lesson), ответ "val" ×2
- tapOn: "DF author catalog"
- assertVisible: "DF author course"
- tapOn: "DF author course"
- assertVisible: "DF author section"
- tapOn: "DF author section"
- assertVisible: "DF author theme"
- tapOn: "DF author theme"
- assertVisible: "DF author lesson"
- tapOn: "DF author lesson"
- runFlow:
    when:
      visible: "^GOT IT$"
    commands:
      - tapOn: "^GOT IT$"
- tapOn: "^val$"
- assertVisible: "CORRECT"
- extendedWaitUntil:
    visible: "Continue lesson"
    timeout: 30000
- tapOn: "Continue lesson"
- tapOn: "^val$"
- extendedWaitUntil:
    visible: "Continue lesson"
    timeout: 30000
- tapOn: "Continue lesson"
- extendedWaitUntil:
    visible: "Sync result now"
    timeout: 60000
- tapOn: "Sync result now"
# Первое согласие на платные условия обязательно для свежего аккаунта mvp
# (CAP-16, evidence 2026-10-31-devicefarm-99-accessibility) — закрываем диалог.
- runFlow:
    when:
      visible: "Accept and send"
    commands:
      - tapOn: "Accept and send"
- extendedWaitUntil:
    visible: "Completion confirmed by the server"
    timeout: 120000
- takeScreenshot: "426-lesson-result"
# ── Вход 1: «Сообщить об ошибке» (REPORT, бесплатно)
- scrollUntilVisible:
    element:
      text: "Report a mistake"
    direction: DOWN
    timeout: 15000
- tapOn: "^Propose$"
- assertVisible: "REPORT A MISTAKE"
- takeScreenshot: "426-report-sheet-empty"
- tapOn: "What is wrong with this lesson?"
- inputText: "DF426 device report: the wording of the question can be clearer"
- hideKeyboard
- extendedWaitUntil:
    visible: "^Free$"
    timeout: 45000
- takeScreenshot: "426-report-filled"
- tapOn:
    text: "^Propose to author$"
    index: 0
- runFlow:
    when:
      visible: "^Cancel$"
    commands:
      - tapOn: "^Cancel$"
- takeScreenshot: "426-report-submitted"
# ── Вход 2: «Предложить правку» (COPY_EDIT, отметка верного в копии)
- scrollUntilVisible:
    element:
      text: "Suggest an edit"
    direction: DOWN
    timeout: 15000
- tapOn:
    text: "^Propose$"
    below:
      text: "Suggest an edit"
- extendedWaitUntil:
    visible: "SUGGEST AN EDIT"
    timeout: 60000
- takeScreenshot: "426-copyedit-sheet"
- tapOn: "Mark the correct answer"
- tapOn: "^val$"
- extendedWaitUntil:
    visible: "^Marked$"
    timeout: 30000
- takeScreenshot: "426-copyedit-marked"
- tapOn:
    text: "^Propose to author$"
    index: 0
- runFlow:
    when:
      visible: "^Cancel$"
    commands:
      - tapOn: "^Cancel$"
- takeScreenshot: "426-copyedit-submitted"
# ── Вход 3: свой урок с путём в чужом курсе (NEW_LESSON, 1000 ноликов)
# «Exit lesson» — contentDescription иконки-× в фиксированном верхнем баре
# (CrossButton.kt, runner_cd_exit_lesson), текстового узла нет — тап по координате
# (evidence 2026-10-31-devicefarm-99-accessibility, v2/v3 FALL об этот же селектор).
- tapOn:
    point: "90%,6%"
- runFlow:
    when:
      visible: "^Exit$"
    commands:
      - tapOn: "^Exit$"
- tapOn: "Open menu"
- tapOn: "^SYNC NOW$"
- extendedWaitUntil:
    visible: "Last sync: .*"
    timeout: 90000
# В v4.0.1 «My quests» — 9-й пункт шторки LOCAL (ниже кромки, см. evidence
# 2026-10-31-devicefarm-420-review): скролл шторки + тап по фактической метке.
- scrollUntilVisible:
    element:
      text: "My quests"
    direction: DOWN
    timeout: 15000
- tapOn: "My quests"
- tapOn: "Create quest"
- assertVisible: "Quest creation"
- tapOn: "^Quest$"
- inputText: "DF426 proposer quest"
- hideKeyboard
- tapOn:
    text: "^Create$"
    below:
      text: "^Quest$"
- tapOn: "^Section$"
- inputText: "DF426 proposer section"
- hideKeyboard
- tapOn:
    text: "^Create$"
    below:
      text: "^Section$"
- tapOn: "^Topic$"
- inputText: "DF426 proposer topic"
- hideKeyboard
- tapOn:
    text: "^Create$"
    below:
      text: "^Topic$"
- tapOn: "^Lesson$"
- inputText: "DF426 proposer lesson"
- hideKeyboard
- tapOn:
    text: "^Create$"
    below:
      text: "^Lesson$"
- tapOn: "Easy questions"
- extendedWaitUntil:
    visible: "Add question"
    timeout: 30000
- tapOn: "Add question"
- tapOn: "^Ordering$"
- tapOn: "^Question$"
- inputText: "DF426 proposer ordering question"
- hideKeyboard
- tapOn: "^Item$"
- inputText: "DF426 proposer first"
- hideKeyboard
- tapOn: "Add item"
- tapOn:
    text: "^Item$"
    index: 1
- inputText: "DF426 proposer second"
- hideKeyboard
- tapOn: "Back to structure"
- tapOn: "Propose to author"
- assertVisible: "PROPOSE YOUR LESSON TO ANOTHER AUTHOR"
- takeScreenshot: "426-proposal-dialog-open"
- tapOn: "Course catalog"
- tapOn: "DF author catalog"
- tapOn: "^Quest$"
- tapOn: "DF author course"
- tapOn: "^Section$"
- tapOn: "DF author section"
- tapOn: "^Topic$"
- tapOn: "DF author theme"
- extendedWaitUntil:
    visible: "Fee: 1000 nolics"
    timeout: 45000
- takeScreenshot: "426-proposal-dialog-target-chosen"
- tapOn:
    text: "^Propose to author$"
    index: 1
# Платная подача (Fee: 1000 nolics) может поднять тот же economy-consent, если
# согласие ещё не захвачено — закрывашка условная, без диалога это no-op.
- runFlow:
    when:
      visible: "Accept and send"
    commands:
      - tapOn: "Accept and send"
- extendedWaitUntil:
    visible: "Proposal queued"
    timeout: 120000
- takeScreenshot: "426-new-lesson-proposed"
# ── Исходы: предлагающий видит три записи в «Решениях» → «Предложения»
- tapOn: "^Back$"
- runFlow:
    when:
      visible: "^Exit$"
    commands:
      - tapOn: "^Exit$"
- tapOn: "Open menu"
- tapOn: "^SYNC NOW$"
- extendedWaitUntil:
    visible: "Last sync: .*"
    timeout: 90000
- tapOn: "Open menu"
- tapOn: "^DECISIONS$"
- extendedWaitUntil:
    visible: "My proposals"
    timeout: 60000
- tapOn: "My proposals"
- extendedWaitUntil:
    visible: "Error report"
    timeout: 120000
- takeScreenshot: "426-proposer-outgoing"
- scrollUntilVisible:
    element:
      text: "New lesson"
    direction: DOWN
    timeout: 20000
- takeScreenshot: "426-proposer-outgoing-full"
# ── Автор (mvpb): «Предложения» → «For my lessons» — задержанные проверки до
# автора не доезжают (без ключа модели терминал CHECK_DELAYED невидим владельцу цели)
- launchApp:
    appId: com.tpov.schoolquiz.mvpb
    clearState: false
- assertVisible: "HOME QUESTS"
- tapOn: "Open menu"
- tapOn: "^DECISIONS$"
- extendedWaitUntil:
    visible: "For my lessons"
    timeout: 60000
- takeScreenshot: "426-author-proposals"
