appId: com.tpov.schoolquiz.mvp
name: E2B start answer and preserved-data relaunch
---
- launchApp:
    clearState: false
- tapOn: ${E2B_SELECTOR_INTERNET}
- extendedWaitUntil:
    visible: ${E2B_SELECTOR_ARENA_TITLE}
    timeout: 60000
- scrollUntilVisible:
    element:
      text: ${E2B_SELECTOR_SHOW_LOCAL_TICKETS}
    direction: DOWN
    timeout: 60000
- extendedWaitUntil:
    visible:
      text: ${E2B_SELECTOR_SHOW_LOCAL_TICKETS}
      enabled: true
    timeout: 60000
- tapOn:
    text: ${E2B_SELECTOR_SHOW_LOCAL_TICKETS}
    enabled: true
    retryTapIfNoChange: true
- scrollUntilVisible:
    element:
      text: ${E2B_SELECTOR_TICKET_LABEL}
    direction: DOWN
    timeout: 60000
- assertVisible: ${E2B_SELECTOR_TICKET_LABEL}
# The exact label has just been found. Its action row is rendered below the
# visible card fragment, so reveal that immediate action before tapping it.
- scrollUntilVisible:
    element:
      text: ${E2B_SELECTOR_TICKET_START}
      below:
        text: ${E2B_SELECTOR_TICKET_LABEL}
    direction: DOWN
    timeout: 60000
- tapOn:
    text: ${E2B_SELECTOR_TICKET_START}
    below:
      text: ${E2B_SELECTOR_TICKET_LABEL}
    enabled: true
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: ${E2B_SELECTOR_QUESTION}
    timeout: 60000
- tapOn: ${E2B_SELECTOR_FIRST_ANSWER}
# On HARD content the feedback overlay can intentionally hide the selected option and verdict.
# This selector identifies the feedback control; the following Room read binds it to the answer.
- extendedWaitUntil:
    visible: ${E2B_SELECTOR_SAVED_ANSWER}
    timeout: 60000
- takeScreenshot: "02-e2b-answer-saved-before-relaunch"
# stopApp is the intentional process stop. launchApp retains the application data.
- stopApp
- launchApp:
    clearState: false
# A cold launcher entry opens Home, not the retained Arena runner. Re-enter the
# same exact ticket through the local-ticket view; never prepare another one.
- tapOn: ${E2B_SELECTOR_INTERNET}
- extendedWaitUntil:
    visible: ${E2B_SELECTOR_ARENA_TITLE}
    timeout: 60000
- scrollUntilVisible:
    element:
      text: ${E2B_SELECTOR_SHOW_LOCAL_TICKETS}
    direction: DOWN
    timeout: 60000
- extendedWaitUntil:
    visible:
      text: ${E2B_SELECTOR_SHOW_LOCAL_TICKETS}
      enabled: true
    timeout: 60000
- tapOn:
    text: ${E2B_SELECTOR_SHOW_LOCAL_TICKETS}
    enabled: true
    retryTapIfNoChange: true
- scrollUntilVisible:
    element:
      text: ${E2B_SELECTOR_TICKET_LABEL}
    direction: DOWN
    timeout: 60000
- assertVisible: ${E2B_SELECTOR_TICKET_LABEL}
# As above, search downward from the exact ticket card for its immediate open
# action; historical cards are never used as a replacement ticket.
- scrollUntilVisible:
    element:
      text: ${E2B_SELECTOR_TICKET_OPEN}
      below:
        text: ${E2B_SELECTOR_TICKET_LABEL}
    direction: DOWN
    timeout: 60000
- tapOn:
    text: ${E2B_SELECTOR_TICKET_OPEN}
    below:
      text: ${E2B_SELECTOR_TICKET_LABEL}
    enabled: true
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: ${E2B_SELECTOR_RESUME_OR_SAVED}
    timeout: 60000
- runFlow:
    when:
      visible: ${E2B_SELECTOR_RESUME_DIALOG}
    commands:
      - tapOn: ${E2B_SELECTOR_RESUME_CONTINUE}
- extendedWaitUntil:
    visible: ${E2B_SELECTOR_SAVED_ANSWER}
    timeout: 60000
- assertVisible: ${E2B_SELECTOR_SAVED_ANSWER}
- takeScreenshot: "02-e2b-answer-restored-after-relaunch"
# Freeze the verified post-relaunch state before the runner makes its private
# Room copy. The following flow performs a second retained-data launch and
# completes this exact ticket only after the read-only progress proof passes.
- stopApp
