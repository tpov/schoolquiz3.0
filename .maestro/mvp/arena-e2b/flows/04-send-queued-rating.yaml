appId: com.tpov.schoolquiz.mvp
name: E2B deliver the retained queued rating
---
# The rating ID is captured from Room before this flow. `stopApp` is the
# required retained-data process stop; launchApp must then rediscover the exact
# settled ticket and its already queued rating before the manual sync action.
# This flow never taps Rate 2 or creates a replacement rating intent.
- stopApp
- launchApp:
    clearState: false
- tapOn: ${E2B_SELECTOR_INTERNET}
- extendedWaitUntil:
    visible: ${E2B_SELECTOR_ARENA_TITLE}
    timeout: 60000
- scrollUntilVisible:
    element:
      text: ${E2B_SELECTOR_SHOW_LOCAL_TICKETS}
    direction: DOWN
    timeout: 60000
- extendedWaitUntil:
    visible:
      text: ${E2B_SELECTOR_SHOW_LOCAL_TICKETS}
      enabled: true
    timeout: 60000
- tapOn:
    text: ${E2B_SELECTOR_SHOW_LOCAL_TICKETS}
    enabled: true
    retryTapIfNoChange: true
- scrollUntilVisible:
    element:
      text: ${E2B_SELECTOR_TICKET_LABEL}
    direction: DOWN
    timeout: 60000
- assertVisible: ${E2B_SELECTOR_TICKET_LABEL}
- scrollUntilVisible:
    element:
      text: ${E2B_SELECTOR_TICKET_OPEN}
      below:
        text: ${E2B_SELECTOR_TICKET_LABEL}
    direction: DOWN
    timeout: 60000
- tapOn:
    text: ${E2B_SELECTOR_TICKET_OPEN}
    below:
      text: ${E2B_SELECTOR_TICKET_LABEL}
    enabled: true
    retryTapIfNoChange: true
- assertVisible: ${E2B_SELECTOR_SETTLE_CONFIRMED}
- assertVisible: ${E2B_SELECTOR_RATING_QUEUED}
- takeScreenshot: "04-e2b-queued-rating-restored-after-relaunch"
- tapOn:
    text: ${E2B_SELECTOR_SEND_QUEUED_RATING}
    enabled: true
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: ${E2B_SELECTOR_RATING_ACCEPTED}
    timeout: 60000
- takeScreenshot: "04-e2b-queued-rating-delivered"
