appId: com.tpov.schoolquiz.mvp
name: E2B selected HARD preparation
---
# The preceding preflight deliberately finishes at the selected lesson card.
# Re-establish the page anchor before requiring the title; otherwise a valid
# retained catalog fails merely because its header is off-screen.
- scrollUntilVisible:
    element:
      text: ${E2B_SELECTOR_ARENA_TITLE}
    direction: UP
    timeout: 20000
- assertVisible: ${E2B_SELECTOR_ARENA_TITLE}
- scrollUntilVisible:
    element:
      text: ${E2B_SELECTOR_FIXTURE_AUTHOR}
    direction: DOWN
    timeout: 20000
- assertVisible: ${E2B_SELECTOR_FIXTURE_AUTHOR}
- scrollUntilVisible:
    element:
      text: ${E2B_SELECTOR_FROZEN_PRICE}
      below:
        text: ${E2B_SELECTOR_FIXTURE_AUTHOR}
    direction: DOWN
    timeout: 20000
- assertVisible: ${E2B_SELECTOR_FROZEN_PRICE}
- scrollUntilVisible:
    element:
      text: ${E2B_SELECTOR_SELECTED_PREPARE}
      below:
        text: ${E2B_SELECTOR_FIXTURE_AUTHOR}
    direction: DOWN
    timeout: 20000
- tapOn:
    text: ${E2B_SELECTOR_SELECTED_PREPARE}
    below:
      text: ${E2B_SELECTOR_FIXTURE_AUTHOR}
    enabled: true
    retryTapIfNoChange: true
- assertVisible: ${E2B_SELECTOR_PREPARE_DIALOG}
- tapOn: ${E2B_SELECTOR_DIFFICULTY_HARD}
- assertVisible: ${E2B_SELECTOR_HARD_SELECTED}
- takeScreenshot: "01-e2b-selected-hard-consent"
- tapOn: ${E2B_SELECTOR_PREPARE_CONFIRM}
# Confirmation creates a ticket but leaves the catalog scrolled to its card.
# Return to the explicit local-ticket list before asserting the start control.
- scrollUntilVisible:
    element:
      text: ${E2B_SELECTOR_SHOW_LOCAL_TICKETS}
    direction: UP
    timeout: 60000
- extendedWaitUntil:
    visible:
      text: ${E2B_SELECTOR_SHOW_LOCAL_TICKETS}
      enabled: true
    timeout: 60000
- tapOn:
    text: ${E2B_SELECTOR_SHOW_LOCAL_TICKETS}
    enabled: true
    retryTapIfNoChange: true
- scrollUntilVisible:
    element:
      text: ${E2B_SELECTOR_PREPARED_TICKET}
    direction: DOWN
    timeout: 60000
- assertVisible: ${E2B_SELECTOR_PREPARED_TICKET}
- takeScreenshot: "01-e2b-ticket-prepared"
