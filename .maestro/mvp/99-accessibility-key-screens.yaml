appId: com.tpov.schoolquiz.mvp
name: Accessibility key screens sweep at elevated font scale (9.9)
---
# 9.9 автоматизируемая половина: ключевые флоу (меню / синк / урок / арена-каталог /
# магазин) на повышенном масштабе шрифта (MAESTRO_FONT_SCALE=1.3 задаёт тест-спека),
# скриншот каждого экрана. TalkBack/фокус — remote access руками владельца.
- launchApp:
    clearState: false
- assertVisible: "HOME QUESTS"
- takeScreenshot: "99-home-quests"
- tapOn: "Open menu"
- assertVisible: "^SYNC NOW$"
- takeScreenshot: "99-drawer-menu"
- tapOn: "^SYNC NOW$"
- extendedWaitUntil:
    visible: "Last sync: .*"
    timeout: 90000
- assertNotVisible: "Not synced yet"
- takeScreenshot: "99-sync-last"
- tapOn: "^HOME QUESTS$"
# ── Урок: фикстура mvp-smoke-v2 (MVP validated checks → MVP smoke course), ответ "val"
- assertVisible: "MVP validated checks"
- tapOn: "MVP validated checks"
- assertVisible: "MVP smoke course"
- tapOn: "MVP smoke course"
- assertVisible: "MVP section"
- tapOn: "MVP section"
- assertVisible: "MVP theme"
- tapOn: "MVP theme"
- assertVisible: "MVP quick lesson"
- tapOn: "MVP quick lesson"
- runFlow:
    when:
      visible: "^GOT IT$"
    commands:
      - tapOn: "^GOT IT$"
- takeScreenshot: "99-lesson-first-question"
- tapOn: "^val$"
- assertVisible: "CORRECT"
- takeScreenshot: "99-answer-feedback"
- extendedWaitUntil:
    visible: "Continue lesson"
    timeout: 30000
- tapOn: "Continue lesson"
- tapOn: "^val$"
- extendedWaitUntil:
    visible: "Continue lesson"
    timeout: 30000
- tapOn: "Continue lesson"
- extendedWaitUntil:
    visible: "Sync result now"
    timeout: 60000
- takeScreenshot: "99-lesson-result-before-sync"
- tapOn: "Sync result now"
# Свежее устройство обязано дать первое согласие на платные условия (CAP-16:
# TermsConsentGate captured==null → Required) — иначе «Completion confirmed»
# недостижим (evidence 2026-10-31-devicefarm-99-accessibility, прогон 2).
- runFlow:
    when:
      visible: "Accept and send"
    commands:
      - tapOn: "Accept and send"
- extendedWaitUntil:
    visible: "Completion confirmed by the server"
    timeout: 120000
- takeScreenshot: "99-lesson-result"
- scrollUntilVisible:
    element:
      text: "Report a mistake"
    direction: DOWN
    timeout: 15000
- takeScreenshot: "99-result-entries"
# Выход из урока обратно в оболочку. На экране результата выходного контрола НЕТ
# вовсе (ResultContent.kt — только Run again / Next lesson / discussion; ×-бейдж
# живёт только на ЭКРАНАХ ВОПРОСОВ и стоит СЛЕВА, QuestionProgressHeader.kt), так
# что point-tap «90%,6%» попадал в пустую зону хедера и диалог «Exit» не поднимался
# (v4 FALL, evidence 2026-10-31-devicefarm-99-accessibility, диагноз по коду).
# Выход — системный Back; подтверждение закрывает условный тап по диалогу ниже.
- pressKey: back
- runFlow:
    when:
      visible: "^Exit$"
    commands:
      - tapOn: "^Exit$"
- assertVisible: "Open menu"
- tapOn: "Open menu"
- takeScreenshot: "99-menu-after-lesson"
# Шторка открыта и перекрывает вкладки нижней нав-полосы (v6 FALL, кадр flast: тап по
# «ARENA» — Element not found): ARENA/SHOP — вкладки полосы, а не пункты шторки. Закрываем
# шторку тапом по скриму — паттерн 513-флоу (evidence 2026-10-31-devicefarm-513-tournament).
- tapOn:
    point: "94%,50%"
# ── Арена-каталог. Вкладки «ARENA» в полосе этой сборки НЕТ (локальная кампания A14
# 03.11: полоса = LOCAL/INTERNET/EVENTS/SHOP; скрин после скрим-тапа: фолл v6 «Tap
# ARENA — Element not found» был не только про перекрытую шторку). Арена = вкладка
# INTERNET: её экран называется «ARENA», шага «Open lesson catalog» нет — LOAD
# LESSONS напрямую (доказано live: Loaded N of N lessons с сервера демо-рига).
- tapOn: "^INTERNET$"
- extendedWaitUntil:
    visible: "^Load lessons$"
    timeout: 30000
- takeScreenshot: "99-arena-before-load"
- tapOn: "^Load lessons$"
- extendedWaitUntil:
    visible: "Loaded [0-9]+ of [0-9]+ lessons"
    timeout: 90000
- takeScreenshot: "99-arena-catalog"
# ── Магазин
- tapOn: "Open menu"
# Тот же скрим-тап: SHOP — вкладка нижней нав-полосы, открытая шторка её перекрывает.
- tapOn:
    point: "94%,50%"
- tapOn: "^SHOP$"
- extendedWaitUntil:
    visible: "Premium"
    timeout: 30000
- takeScreenshot: "99-shop"
