# Исходы автора на карточке: «Returned: …» + «Failed: N question(s)» + построчные
# причины + «Fix the questions».
- extendedWaitUntil:
    visible: "Fix the questions"
    timeout: 120000
- takeScreenshot: "420r-author-outcomes"
- scrollUntilVisible:
    element:
      text: "Fix the questions"
    direction: DOWN
    timeout: 15000
- takeScreenshot: "420r-author-outcomes-full"
# Действие исхода: «Fix the questions» открывает редактор с заваленными вопросами.
- tapOn: "Fix the questions"
- takeScreenshot: "420r-fix-editor"
