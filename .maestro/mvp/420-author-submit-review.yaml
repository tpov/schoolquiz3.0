# Исходы автора на карточке (искомое состояние, локальная кампания 03.11):
# «Returned: …» + «Failed: N question(s)» + построчные причины + «Fix the questions».
- extendedWaitUntil:
    visible: "Fix the questions"
    timeout: 120000
- takeScreenshot: "420-author-outcomes"
- scrollUntilVisible:
    element:
      text: "Fix the questions"
    direction: DOWN
    timeout: 15000
- takeScreenshot: "420-author-outcomes-full"
# Действие исхода: «Fix the questions» ведёт в редактор с заваленными вопросами —
# замыкает авторский цикл подачи.
- tapOn: "Fix the questions"
- takeScreenshot: "420-fix-editor"
