appId: com.tpov.schoolquiz.mvp
name: Author submits a draft for review and observes the delayed check (4.20 partial)
---
# 4.20 авторская половина без модельного ключа: черновик → «Send to arena» (плата
# 1000, очередь) → UNDER_REVIEW («Checking: “Words” · “Facts”») → честный REVIEW_DELAYED
# («Check is taking longer than expected») после свипов воркера с VPS (модель не
# настроена — REVIEW_MODEL_ENV_MISSING выжигает попытки этапов, конвейер уходит в
# DELAYED). Живые вердикты «Слов»/«Фактов» — хвост владельца (ключ модели).
- launchApp:
    clearState: false
- assertVisible: "HOME QUESTS"
- tapOn: "Open menu"
- assertVisible: "^SYNC NOW$"
- tapOn: "^SYNC NOW$"
- extendedWaitUntil:
    visible: "Last sync: .*"
    timeout: 90000
# В v4.0.1 авторская зона — «My quests», 9-й пункт шторки LOCAL ниже кромки
# (evidence 2026-10-31-devicefarm-420-review): скролл шторки + фактическая метка.
- scrollUntilVisible:
    element:
      text: "My quests"
    direction: DOWN
    timeout: 15000
- tapOn: "My quests"
- takeScreenshot: "420-my-quests"
# Создание структуры: квест → раздел → тема → урок
- tapOn: "Create quest"
- assertVisible: "Quest creation"
- takeScreenshot: "420-create-empty"
- tapOn: "^Quest$"
- inputText: "DF420 review journey quest"
- hideKeyboard
- tapOn:
    text: "^Create$"
    below:
      text: "^Quest$"
- tapOn: "^Section$"
- inputText: "DF420 section"
- hideKeyboard
- tapOn:
    text: "^Create$"
    below:
      text: "^Section$"
- tapOn: "^Topic$"
- inputText: "DF420 topic"
- hideKeyboard
- tapOn:
    text: "^Create$"
    below:
      text: "^Topic$"
- tapOn: "^Lesson$"
- inputText: "DF420 lesson"
- hideKeyboard
- tapOn:
    text: "^Create$"
    below:
      text: "^Lesson$"
- takeScreenshot: "420-structure-created"
# Простой вопрос без отметки верного (Ordering): два пункта достаточно
- tapOn: "Easy questions"
- extendedWaitUntil:
    visible: "Add question"
    timeout: 30000
- tapOn: "Add question"
- tapOn: "^Ordering$"
- tapOn: "^Question$"
- inputText: "DF420 easy ordering question"
- hideKeyboard
- tapOn: "^Item$"
- inputText: "DF420 easy first"
- hideKeyboard
- tapOn: "Add item"
- tapOn:
    text: "^Item$"
    index: 1
- inputText: "DF420 easy second"
- hideKeyboard
- tapOn: "Back to structure"
- tapOn: "Hard questions"
- extendedWaitUntil:
    visible: "Add question"
    timeout: 30000
- tapOn: "Add question"
- tapOn: "^Ordering$"
- tapOn: "^Question$"
- inputText: "DF420 hard ordering question"
- hideKeyboard
- tapOn: "^Item$"
- inputText: "DF420 hard first"
- hideKeyboard
- tapOn: "Add item"
- tapOn:
    text: "^Item$"
    index: 1
- inputText: "DF420 hard second"
- hideKeyboard
- tapOn: "Back to structure"
- takeScreenshot: "420-questions-done"
# Промежуточный синк ради кошелька (v3 FALL: economy-гейт подачи сравнил ЛОКАЛЬНЫЙ
# снимок кошелька — 0 — с ценой 1000 и терминально отказал, AD-28; topup от
# watch-420 уже лежал на сервере, но писался прямым admin set() — клиент узнаёт о
# нём только refreshProfile() из sync(), а авторинг к этому моменту шёл без единого
# синка). Авторинг занял минуты — topup давно на сервере; выходим в список,
# синкаемся, возвращаемся в черновик: к «Send to arena» локальный кошелёк уже 3000.
- tapOn: "^Back$"
- assertVisible: "DF420 review journey quest"
- tapOn: "Open menu"
- tapOn: "^SYNC NOW$"
- extendedWaitUntil:
    visible: "Last sync: .*"
    timeout: 90000
- takeScreenshot: "420-wallet-synced"
- scrollUntilVisible:
    element:
      text: "My quests"
    direction: DOWN
    timeout: 15000
- tapOn: "My quests"
- tapOn: "DF420 review journey quest"
- assertVisible: "Quest creation"
# Подача: плата 1000 ноликов списывается сервером при приёме заявки. После
# добавленных вопросов структура выросла — «Send to arena» уходит ниже кромки,
# доскролливаем (evidence 2026-10-31-devicefarm-420-review, v2 FALL).
- scrollUntilVisible:
    element:
      text: "Send to arena"
    direction: DOWN
    timeout: 15000
- tapOn: "Send to arena"
# Платная подача на свежем устройстве поднимает economy-consent (CAP-16,
# captured==null → Required, evidence 2026-10-31-devicefarm-99-accessibility):
# закрываем диалог, после чего заявка уходит в очередь дренирующим синком ниже.
- runFlow:
    when:
      visible: "Accept and send"
    commands:
      - tapOn: "Accept and send"
- extendedWaitUntil:
    visible: ".*queued for arena"
    timeout: 120000
- takeScreenshot: "420-arena-queued"
- tapOn: "^Back$"
- assertVisible: "DF420 review journey quest"
- takeScreenshot: "420-back-to-my-quests"
# Заявка уходит на сервер (outbox дренирует синк), сервер ставит UNDER_REVIEW
- tapOn: "Open menu"
- tapOn: "^SYNC NOW$"
- extendedWaitUntil:
    visible: "Last sync: .*"
    timeout: 90000
- scrollUntilVisible:
    element:
      text: "My quests"
    direction: DOWN
    timeout: 15000
- tapOn: "My quests"
# v4 FALL (evidence 2026-10-31-devicefarm-420-review): заявка создаётся на сервере
# уже ПОСЛЕ дренажного синка выше — статус «Checking» клиент показывает только по
# данным синка, сам не обновляется. Повторный SYNC NOW перед ассертом привозит
# UNDER_REVIEW на устройство (тот же класс правки, что «второй синк» 5.13).
- tapOn: "Open menu"
- tapOn: "^SYNC NOW$"
- extendedWaitUntil:
    visible: "Last sync: .*"
    timeout: 90000
- scrollUntilVisible:
    element:
      text: "My quests"
    direction: DOWN
    timeout: 15000
- tapOn: "My quests"
- extendedWaitUntil:
    visible: "Checking: “Words” · “Facts”"
    timeout: 300000
- takeScreenshot: "420-under-review"
# Воркер с VPS доводит конвейер живой моделью до ТЕРМИНАЛА (QUEST_REVIEWED с
# вердиктами WORDS/FACTS/TRANSLATE — glm-4.7 настроен на риге; DELAYED при живой
# модели не наступает, ждать его не нужно). Исходы автора (4.16 UX-6) читаются
# ТОЛЬКО по синку: карточка черновика показывает «Returned: <причина>», «Failed:
# N question(s)», построчные причины и кнопку «Fix the questions» (рендерится
# только у rejected). Терпеливые условные циклы «синк → My quests» (каждый
# ~20-30 с): конвейеру нужно несколько минут (WORDS/FACTS минутные вызовы +
# TRANSLATE-фаза до ~5-7 мин); когда исход появится, оставшиеся циклы — skip.
- runFlow:
    when:
      notVisible: "Fix the questions"
    commands:
      - tapOn: "Open menu"
      - tapOn: "^SYNC NOW$"
      - extendedWaitUntil:
          visible: "Last sync: .*"
          timeout: 90000
      - scrollUntilVisible:
          element:
            text: "My quests"
          direction: DOWN
          timeout: 15000
      - tapOn: "My quests"
