appId: com.tpov.schoolquiz.mvp
name: Arena matrix reach unloaded catalog without server actions
---
- launchApp:
    clearState: false
- assertVisible: ${MATRIX_SELECTOR_HOME}
- tapOn: ${MATRIX_SELECTOR_INTERNET}
- runFlow:
    when:
      notVisible: ${MATRIX_SELECTOR_ARENA_TITLE}
    commands:
      - tapOn: ${MATRIX_SELECTOR_OPEN_MENU}
      - tapOn: ${MATRIX_SELECTOR_ARENA_NAV}
- assertVisible: ${MATRIX_SELECTOR_ARENA_TITLE}
- runFlow:
    when:
      visible: ${MATRIX_SELECTOR_OPEN_CATALOG}
    commands:
      - tapOn: ${MATRIX_SELECTOR_OPEN_CATALOG}
- assertVisible: ${MATRIX_SELECTOR_CATALOG_PROMPT}
- assertVisible: ${MATRIX_SELECTOR_LOAD_LESSONS}
- assertVisible: ${MATRIX_SELECTOR_ARENA_RESERVATIONS}
- assertNotVisible: ${MATRIX_SELECTOR_LOADED_CATALOG}
- assertNotVisible: ${MATRIX_SELECTOR_PREPARE}
- assertNotVisible: ${MATRIX_SELECTOR_CONFIRM_PREPARATION}
- assertNotVisible: ${MATRIX_SELECTOR_CONFIRM_CANCELLATION}
- assertNotVisible: ${MATRIX_SELECTOR_TICKET_LABEL}
- assertNotVisible: ${MATRIX_SELECTOR_TICKET_STATE}
- assertNotVisible: ${MATRIX_SELECTOR_START}
- assertNotVisible: ${MATRIX_SELECTOR_OPEN_SAVED}
- assertNotVisible: ${MATRIX_SELECTOR_SYNCHRONIZE}
- assertNotVisible: ${MATRIX_SELECTOR_RATING_PROMPT}
- assertNotVisible: ${MATRIX_SELECTOR_RUNNER_ACTIVE}
- assertNotVisible: ${MATRIX_SELECTOR_RECEIPT}
- assertNotVisible: ${MATRIX_SELECTOR_RATING}
- takeScreenshot: "01-idle-catalog-before-system-back"
