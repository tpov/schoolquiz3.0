</head>
<body>
    <div class="container">
        <h1>🚀 Загрузка данных SchoolQuiz в Firestore</h1>
        
        <div>
            <h3>Шаги для загрузки:</h3>
            <ol>
                <li>Нажмите "Инициализировать Firebase"</li>
                <li>Нажмите "Загрузить данные SchoolQuiz"</li>
                <li>Проверьте результат в логах ниже</li>
            </ol>
        </div>

        <div>
            <button onclick="initFirebase()" id="initBtn">Инициализировать Firebase</button>
            <button onclick="uploadData()" id="uploadBtn" disabled>Загрузить данные SchoolQuiz</button>
            <button onclick="clearLogs()" id="clearBtn">Очистить логи</button>
        </div>

        <div id="logs" class="log">
            <div class="info">📝 Логи загрузки будут отображаться здесь...</div>

        // Конфигурация Firebase для проекта school-quiz-89336951

            authDomain: "school-quiz-89336951.firebaseapp.com",
            projectId: "school-quiz-89336951",
            storageBucket: "school-quiz-89336951.appspot.com",
            messagingSenderId: "762375057396",

        };

        let app;
        let db;

        window.initFirebase = function() {
            try {
                app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                log('✅ Firebase инициализирован успешно!', 'success');
                document.getElementById('uploadBtn').disabled = false;
                document.getElementById('initBtn').disabled = true;
            } catch (error) {
                log('❌ Ошибка инициализации Firebase: ' + error.message, 'error');
            }
        };

        window.uploadData = function() {
            if (!db) {
                log('❌ Firebase не инициализирован!', 'error');
                return;

            log('🚀 Начинаю загрузку данных SchoolQuiz...', 'info');

            // Данные SchoolQuiz

            // Загружаем данные в Firestore
            uploadToFirestore(schoolQuizData);

        async function uploadToFirestore(data) {
            try {
                // Путь: structures/structureData/QUIZ_HOME/SchoolQuiz
                const docRef = doc(db, 'structures', 'structureData', 'QUIZ_HOME', 'SchoolQuiz');
                
                await setDoc(docRef, data);
                
                log('✅ Данные SchoolQuiz успешно загружены!', 'success');
                log('📍 Путь в Firestore: structures/structureData/QUIZ_HOME/SchoolQuiz', 'info');
                log('🎉 Загрузка завершена! Проверьте Firebase Console.', 'success');
                
            } catch (error) {
                log('❌ Ошибка загрузки: ' + error.message, 'error');
                console.error('Upload error:', error);
            }
        }

        function log(message, type = 'info') {
            const logs = document.getElementById('logs');
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = document.createElement('div');
            logEntry.className = type;
            logEntry.innerHTML = `[${timestamp}] ${message}`;
            logs.appendChild(logEntry);
            logs.scrollTop = logs.scrollHeight;
        }

        window.clearLogs = function() {
            document.getElementById('logs').innerHTML = '<div class="info">📝 Логи очищены...</div>';
        };
    </script>
